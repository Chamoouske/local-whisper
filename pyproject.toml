[project]
name = "local-whisper"
version = "0.1.0"
description = "Gerador de legendas pt-BR a partir de vídeos usando faster-whisper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av<14",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
]

[project.scripts]
local-whisper = "local_whisper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
